[package]
name = "adrijanzivkov"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie-key-expansion", "cookie-private"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros", "any", "postgres", "migrate", "tls-rustls"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
