[package]
name = "adrijanzivkov"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
askama = "0.16.1"
axum = "0.8.9"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
